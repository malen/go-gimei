name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        cache-dependency-path: go.sum
    - name: Cross build
      run: make cross
    - name: Create Release
      run: gh release create "$GITHUB_REF_NAME" goxz/* --title "Release $GITHUB_REF_NAME" --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
