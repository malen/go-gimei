name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup mise
      uses: jdx/mise-action@v5
    - name: Cross build
      run: mise run cross
    - name: Create Release
      run: gh release create "$GITHUB_REF_NAME" goxz/* --title "Release $GITHUB_REF_NAME" --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
